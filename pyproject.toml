[project]
name = "aeronexus-flight-backend"
version = "1.0.0"
description = "AeroNexus - FastAPI Cloud production-ready Flight Management System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "bcrypt>=4.0.1",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "groq>=0.9.0",
    "httpx>=0.27.0"
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools]
# Explicitly tell setuptools where to find packages — prevents
# "Multiple top-level packages" error when both backend/ and frontend/ exist
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
exclude = ["frontend*", "venv*", "*.egg-info"]
